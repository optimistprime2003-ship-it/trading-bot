<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 10px;
    }

    h2 {
      margin-top: 20px;
    }

    .card {
      background: #1e293b;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .buy { border-left: 5px solid #22c55e; }
    .sell { border-left: 5px solid #ef4444; }

    .stats {
      display: flex;
      justify-content: space-between;
      background: #020617;
      padding: 10px;
      border-radius: 10px;
    }

    .stat {
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h2>📊 Stats</h2>
<div class="stats" id="stats"></div>

<button onclick="runBot()">🔄 Refresh Signals</button>

<h2>📡 Active Signals</h2>
<div id="signals"></div>

<h2>📁 History</h2>
<div id="history"></div>

<script>
const base = "https://trading-signal-bot-7bb3.onrender.com";

async function runBot() {
  await fetch(base + "/run");
  loadAll();
}

async function loadStats() {
  const res = await fetch(base + "/stats");
  const data = await res.json();

  document.getElementById("stats").innerHTML = `
    <div class="stat">Trades<br>${data.total_trades}</div>
    <div class="stat">Wins<br>${data.wins}</div>
    <div class="stat">Losses<br>${data.losses}</div>
    <div class="stat">Win Rate<br>${data.win_rate}%</div>
  `;
}

async function loadSignals() {
  const res = await fetch(base + "/signals");
  const data = await res.json();

  let html = "";

  data.forEach(s => {
    html += `
      <div class="card ${s.signal === "BUY" ? "buy" : "sell"}">
        <b>${s.pair}</b> (${s.type})<br>
        Entry: ${s.entry}<br>
        SL: ${s.sl}<br>
        TP: ${s.tp}<br>
        Status: ${s.status}
      </div>
    `;
  });

  document.getElementById("signals").innerHTML = html;
}

async function loadHistory() {
  const res = await fetch(base + "/history");
  const data = await res.json();

  let html = "";

  data.reverse().forEach(s => {
    html += `
      <div class="card">
        ${s.pair} → ${s.status}
      </div>
    `;
  });

  document.getElementById("history").innerHTML = html;
}

async function loadAll() {
  loadStats();
  loadSignals();
  loadHistory();
}

loadAll();
</script>

</body>
</html>
