<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 15px;
      background: #020617;
      font-size: 20px;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      background: #020617;
    }

    .tab {
      padding: 12px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .active-tab {
      background: #1e293b;
      font-weight: bold;
    }

    .container {
      padding: 10px;
    }

    .card {
      background: #1e293b;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      animation: fadeIn 0.4s ease;
    }

    .buy { border-left: 5px solid #22c55e; }
    .sell { border-left: 5px solid #ef4444; }

    .strategy {
      font-size: 12px;
      color: #38bdf8;
    }

    .price {
      font-size: 14px;
      margin-top: 5px;
    }

    .stats-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<header>📊 Trading Dashboard</header>

<div class="tabs">
  <div class="tab active-tab" onclick="switchTab('signals')">Signals</div>
  <div class="tab" onclick="switchTab('history')">History</div>
  <div class="tab" onclick="switchTab('stats')">Stats</div>
</div>

<div class="container" id="content"></div>

<audio id="alertSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
const API = "https://trading-signal-bot-7bb3.onrender.com";

let lastSignalCount = 0;

function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active-tab"));
  event.target.classList.add("active-tab");

  if (tab === "signals") loadSignals();
  if (tab === "history") loadHistory();
  if (tab === "stats") loadStats();
}

// ================= SIGNALS =================
async function loadSignals() {
  const res = await fetch(API + "/signals");
  const data = await res.json();

  let html = "";

  if (data.length > lastSignalCount) {
    document.getElementById("alertSound").play();
  }

  lastSignalCount = data.length;

  data.forEach(s => {
    html += `
      <div class="card ${s.signal === 'BUY' ? 'buy' : 'sell'}">
        <div><b>${s.signal} ${s.pair}</b></div>
        <div class="strategy">${s.strategy}</div>
        <div class="price">Entry: ${s.entry}</div>
        <div class="price">SL: ${s.sl}</div>
        <div class="price">TP: ${s.tp}</div>
        <div class="price">Status: ${s.status}</div>
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html || "No signals yet";
}

// ================= HISTORY =================
async function loadHistory() {
  const res = await fetch(API + "/history");
  const data = await res.json();

  let html = "";

  data.slice().reverse().forEach(s => {
    html += `
      <div class="card">
        <div><b>${s.signal} ${s.pair}</b></div>
        <div class="strategy">${s.strategy}</div>
        <div>Status: ${s.status}</div>
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html || "No history yet";
}

// ================= STATS =================
async function loadStats() {
  const res = await fetch(API + "/stats");
  const data = await res.json();

  let html = `
    <div class="stats-box">
      <b>Overall</b><br>
      Trades: ${data.overall.total_trades}<br>
      Wins: ${data.overall.wins}<br>
      Losses: ${data.overall.losses}<br>
      Win Rate: ${data.overall.win_rate}%
    </div>
  `;

  for (let strat in data.by_strategy) {
    let s = data.by_strategy[strat];

    html += `
      <div class="stats-box">
        <b>${strat}</b><br>
        Trades: ${s.total}<br>
        Wins: ${s.wins}<br>
        Losses: ${s.losses}<br>
        Win Rate: ${s.win_rate}%
      </div>
    `;
  }

  document.getElementById("content").innerHTML = html;
}

// ================= AUTO REFRESH =================
setInterval(() => {
  let active = document.querySelector(".active-tab").innerText;

  if (active === "Signals") loadSignals();
  if (active === "History") loadHistory();
  if (active === "Stats") loadStats();
}, 10000);

// Load default
loadSignals();

</script>

</body>
</html>
