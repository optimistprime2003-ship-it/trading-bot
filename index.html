<!DOCTYPE html>
<html>
<head>
  <title>Trading Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 10px;
    }

    h2 {
      margin-top: 20px;
      font-size: 18px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      font-size: 14px;
    }

    .buy {
      border-left: 5px solid #22c55e;
    }

    .sell {
      border-left: 5px solid #ef4444;
    }

    .expired {
      opacity: 0.6;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      background: #020617;
      padding: 10px;
      border-radius: 10px;
    }

    .stat {
      text-align: center;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .header {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<div class="container">

<div class="header">📊 Trading Dashboard</div>

<h2>Stats</h2>
<div class="stats" id="stats">Loading...</div>

<button onclick="runBot()">🔄 Refresh Signals</button>

<h2>📡 Active Signals</h2>
<div id="signals">Loading...</div>

<h2>📁 History</h2>
<div id="history">Loading...</div>

</div>

<script>
const base = "https://trading-signal-bot-7bb3.onrender.com";

// RUN BOT
async function runBot() {
  await fetch(base + "/run");
  loadAll();
}

// LOAD STATS
async function loadStats() {
  const res = await fetch(base + "/stats");
  const data = await res.json();

  document.getElementById("stats").innerHTML = `
    <div class="stat">Trades<br><b>${data.total_trades}</b></div>
    <div class="stat">Wins<br><b>${data.wins}</b></div>
    <div class="stat">Losses<br><b>${data.losses}</b></div>
    <div class="stat">Win Rate<br><b>${data.win_rate}%</b></div>
  `;
}

// LOAD ACTIVE SIGNALS
async function loadSignals() {
  const res = await fetch(base + "/signals");
  const data = await res.json();

  if (data.length === 0) {
    document.getElementById("signals").innerHTML = "No active signals";
    return;
  }

  let html = "";

  data.forEach(s => {
    html += `
      <div class="card ${s.signal === "BUY" ? "buy" : "sell"}">
        <b>${s.pair}</b> (${s.type})<br>
        Entry: ${s.entry}<br>
        SL: ${s.sl}<br>
        TP: ${s.tp}<br>
        Status: ${s.status}<br>
        Time: ${s.time}
      </div>
    `;
  });

  document.getElementById("signals").innerHTML = html;
}

// LOAD HISTORY
async function loadHistory() {
  const res = await fetch(base + "/history");
  const data = await res.json();

  if (data.length === 0) {
    document.getElementById("history").innerHTML = "No history yet";
    return;
  }

  let html = "";

  data.slice().reverse().forEach(s => {
    html += `
      <div class="card expired">
        <b>${s.pair}</b><br>
        Result: ${s.status}
      </div>
    `;
  });

  document.getElementById("history").innerHTML = html;
}

// LOAD EVERYTHING
async function loadAll() {
  loadStats();
  loadSignals();
  loadHistory();
}

// AUTO REFRESH EVERY 30 SECONDS
setInterval(loadAll, 30000);

// INITIAL LOAD
loadAll();
</script>

</body>
</html>
