<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="30">
    <title>Quantum Signal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #05070a);
            color: var(--text-main); min-height: 100vh;
        }
        header {
            padding: 20px; text-align: center; background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 1000;
        }
        header h1 {
            margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        /* Global Stats Bar */
        .global-stats {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
        }
        .main-stat {
            background: var(--card-bg); padding: 15px; border-radius: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-val { font-size: 22px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

        /* Pair Performance Grid */
        .pair-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(15, 23, 42, 0.5); padding: 10px; border-radius: 10px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .pair-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; }
        .pair-rate { color: var(--success); font-size: 13px; font-weight: 700; }
        .pair-total { color: var(--text-dim); font-size: 9px; }

        .live-indicator {
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--success); margin-bottom: 15px;
            background: var(--card-bg); padding: 8px; border-radius: 8px;
        }
        .dot { height: 6px; width: 6px; background: var(--success); border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        table {
            width: 100%; border-collapse: collapse; background: var(--card-bg);
            border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }
        th { text-align: left; padding: 12px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 15px 12px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        td:last-child { color: var(--text-dim); font-size: 12px; }
    </style>
</head>
<body>

<header>
    <h1>Quantum Signal Pro</h1>
</header>

<div class="container">
    <div class="global-stats">
        <div class="main-stat">
            <div class="stat-val">{{TOTAL}}</div>
            <div class="stat-label">Total Signals</div>
        </div>
        <div class="main-stat">
            <div class="stat-val" style="color: var(--success);">{{WINRATE}}</div>
            <div class="stat-label">Global Win Rate</div>
        </div>
    </div>

    <div class="pair-grid">
        {{PAIR_STATS}}
    </div>

    <div class="live-indicator">
        <span class="dot"></span> LIVE MARKET SCANNER ACTIVE
    </div>

    <table>
        <thead>
            <tr>
                <th>Pair</th>
                <th>Signal</th>
                <th>Strategy</th>
            </tr>
        </thead>
        <tbody>
            {{SIGNALS}}
        </tbody>
    </table>
</div>

</body>
</html>
