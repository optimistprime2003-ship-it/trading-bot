<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="refresh" content="30">
    <title>Quantum Signal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, #1e293b, #05070a);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Premium Glass Header */
        header {
            padding: 20px;
            text-align: center;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--success);
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .dot {
            height: 8px; width: 8px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { opacity: 0.4; transform: scale(1.2); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Signal Table Styling designed to catch the Python output */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        th {
            text-align: left;
            padding: 15px;
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 18px 15px;
            font-size: 15px;
        }

        /* Makes the Pair Name stand out */
        td:first-child {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Makes the Strategy text look dim */
        td:last-child {
            color: var(--text-dim);
            font-size: 13px;
        }

        /* Hover effect for the rows injected by Python */
        tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<header>
    <h1>Quantum Signal Pro</h1>
</header>

<div class="container" id="main-content">
    <div class="live-indicator">
        <span class="dot"></span> SECURE CONNECTION ACTIVE & SCANNING
    </div>
    
    <div id="view-container">
        <table>
            <thead>
                <tr>
                    <th>Pair</th>
                    <th>Signal</th>
                    <th>Strategy</th>
                </tr>
            </thead>
            <tbody>
                {{SIGNALS}}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
