<!DOCTYPE html>
<html>
<head>
  <title>Trading Signals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin: 20px 0;
    }

    .container {
      padding: 10px;
    }

    .card {
      background: #1e293b;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      text-align: left;
    }

    .buy {
      border-left: 5px solid #22c55e;
    }

    .sell {
      border-left: 5px solid #ef4444;
    }

    p {
      margin: 5px 0;
    }
  </style>
</head>

<body>

<h1>📊 Live Trading Signals</h1>

<div class="container" id="signals"></div>

<script>
const API = "https://trading-signal-bot-7bb3.onrender.com/signals";

async function loadSignals() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    const container = document.getElementById("signals");
    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.innerHTML = "<p>No signals yet</p>";
      return;
    }

    data.forEach(signal => {
      const div = document.createElement("div");

      div.className = "card " + (signal.signal === "BUY" ? "buy" : "sell");

      div.innerHTML = `
        <h3>${signal.pair} - ${signal.signal}</h3>
        <p>Entry: ${signal.entry}</p>
        <p>SL: ${signal.sl}</p>
        <p>TP: ${signal.tp}</p>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    document.getElementById("signals").innerHTML = "Error loading signals";
  }
}

setInterval(loadSignals, 10000);
loadSignals();
</script>

</body>
</html>
